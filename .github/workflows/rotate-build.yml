name: Rotate — build & publish image

# Rotate's deploy pipeline for this fork. Not the shared letsrotate/release
# workflow: Twenty's Dockerfile needs the monorepo root as context and the
# `twenty` target (server + worker + built front in one image). Pushes
# ghcr.io/letsrotate/rotate-crm:<branch> (dev/test/prod); argocd-image-updater
# (digest strategy) rolls the new digest into argocd-workloads apps/crm.
#
# Upstream twentyhq workflows in this directory are disabled on the fork via
# the GitHub Actions API (see ROTATE.md); they are kept in the tree so
# upstream merges stay conflict-free.

on:
  push:
    branches: [dev, test, prod]
    paths-ignore:
      - 'packages/twenty-docs/**'
      - 'packages/twenty-website/**'
      - 'packages/twenty-zapier/**'
      - 'packages/twenty-e2e-testing/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: rotate-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ghcr.io/letsrotate/rotate-crm:${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The front build needs ~8 GB heap; free the runner's disk so the
      # multi-stage build (deps for front + server) fits comfortably.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version string
        id: version
        run: |
          upstream=$(node -p "require('./packages/twenty-server/package.json').version" 2>/dev/null || echo unknown)
          echo "app_version=${upstream}-rotate.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: |
            ghcr.io/letsrotate/rotate-crm:${{ github.ref_name }}
            ghcr.io/letsrotate/rotate-crm:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha,scope=rotate-crm
          cache-to: type=gha,mode=max,scope=rotate-crm
